version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: ci-failure-analyzer:latest
    container_name: ci_failure_analyzer
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override or extend any values from .env here
      ENVIRONMENT: development
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Resource limits (adjust for your host)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
